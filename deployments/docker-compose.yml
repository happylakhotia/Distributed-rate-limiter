services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - RATE_LIMIT=10
      - RATE_WINDOW_SECONDS=60
    depends_on:
      - redis


